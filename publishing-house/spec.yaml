# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "brandon-training1"
  owner_email: "brthomas@redhat.com"
  content_type: "lab"
  deployment_mode: "self_published"
  initiative_key: "none"
  showroom_type: "zero_touch"
  intake_type: "migration"
  automation_type: "ansible"
  description: "Training repo used to get familiar with Publishing House."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: ""
  workflow_id: "b764b590-3fd7-4806-a9f8-ac1b45339340"

spec:
  title: "Showroom Lab Authoring Essentials"
  learning_objectives:
    - "Configure AsciiDoc variables in site.yml and use the Antora image macro to insert images into lab content"
    - "Understand and configure Antora component descriptors, navigation files (nav.adoc), and the module hierarchy for documentation structure"
    - "Configure terminal and external link tabs in Showroom UI environments using tab properties and validation"
  modules:
    - id: module-01
      title: "Writing your lab"
      duration_min: 10
      status: not_started
    - id: module-02
      title: "Antora"
      duration_min: 10
      status: not_started
    - id: module-03
      title: "Tabs"
      duration_min: 10
      status: not_started
  audience: "beginner"
  duration_hours: 0.5
  environment:
    platform: "rhel-vms"       # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student:
      - role: browser
        count: 1
        cpu: 1
        ram_gb: 1
        disk_gb: 10
        os: "linux"

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: ""                 # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: []              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)

development:
  automation:
    ansible:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: null
    assessment_strategy: ""
    catalog_gap: "This lab addresses a clear niche — training new Showroom lab authors on how to author and configure labs. The catalog does not have content focused specifically on the Publishing House framework and Showroom configuration."
    design_overview: "This lab teaches new Showroom authors how to write and configure labs using the Publishing House framework. Participants learn AsciiDoc syntax, Antora configuration, and UI tab setup through three 10-minute modules. All content is browser-based with no infrastructure requirements."
    module_summaries:
      - "Module 1: Learn to use AsciiDoc variables and the Antora image macro for basic content authoring."
      - "Module 2: Understand the Antora component descriptor structure and navigation configuration."
      - "Module 3: Master UI tab configuration for terminal access and external links."
    rcars_overlap_pct: 15
    rcars_top_matches:
      - title: "Getting Started with Ansible Development Tools"
        ci_name: "published.ansible-dev-tools.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.ansible-dev-tools.prod"
        relevance_score: 15
        why_it_fits: "Both teach developers to author and configure tools within a framework"
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
